[build-system]
requires = [
    "setuptools>=68"
]
build-backend = "setuptools.build_meta"


[project]
name = "openbilanz"
version = "0.44.0"
description = "Lokale Buchhaltungs- und E-Bilanz-Software"
requires-python = ">=3.12,<3.13"



dependencies = [
    "SQLAlchemy",
    "alembic",
    "openpyxl",
    "odfpy",
    "lxml",
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = [
    "src"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
markers = [
    "integration: tests requiring integration with external or installed components",
]

[project.scripts]
openbilanz = "openbilanz.main:main"


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
